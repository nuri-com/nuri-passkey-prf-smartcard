<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuri Wallet</title>
  <link rel="icon" href="icon32.png">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header><img src="icon128.png" alt="Nuri"><h1>Nuri Wallet</h1></header>
  <main id="out" aria-live="polite">Reading card…</main>

  <section class="panel" id="totpPanel">
    <h2>2FA Code (TOTP)</h2>
    <div class="totpRow">
      <code id="totpCode">------</code>
      <span class="k" id="totpMeta">Checking card…</span>
    </div>
    <div class="rowWrap">
      <button id="totpFill" class="primary">Fill in Tab</button>
      <button id="totpCopy">Copy</button>
      <button id="totpRefresh">Refresh</button>
    </div>
    <div id="totpMsg" class="result"></div>
    <details id="totpSetupDetails">
      <summary>Set up / replace TOTP secret</summary>
      <label for="totpSecret">Base32 secret or otpauth:// URI</label>
      <input id="totpSecret" type="password" placeholder="JBSWY3DPEHPK3PXP or otpauth://…" spellcheck="false" autocomplete="off">
      <div id="totpPinRow" hidden>
        <label for="totpPin">TOTP Admin PIN (4–16 chars)</label>
        <input id="totpPin" type="password" placeholder="Chosen on first save (applet v1.1)" autocomplete="off">
      </div>
      <button id="totpSave">Save to Card</button>
    </details>
  </section>

  <section class="panel" id="fidoPanel">
    <h2>FIDO2 Security Key</h2>
    <div id="fidoSite" class="k">Checking active tab…</div>
    <div class="rowWrap">
      <button id="fidoToggle" class="primary">Enable on this site</button>
      <button id="fidoClear">Disable all</button>
    </div>
    <div id="fidoMsg" class="result"></div>
    <details id="fidoSitesDetails">
      <summary id="fidoSitesSummary">Enabled sites (0)</summary>
      <div id="fidoSitesList" class="k">None</div>
    </details>
  </section>

  <section class="panel" id="receivePanel" hidden>
    <h2>Receive</h2>
    <div id="receive"></div>
    <label for="invoiceSats">Lightning invoice · sats</label>
    <div class="row2">
      <input id="invoiceSats" inputmode="numeric" placeholder="2500">
      <button id="invoiceMake">Create</button>
    </div>
    <label for="invoiceMemo">Memo</label>
    <input id="invoiceMemo" placeholder="What is it for?" maxlength="200">
    <div id="invoiceOut" class="result"></div>
  </section>

  <section class="panel" id="sendPanel" hidden>
    <h2>Send</h2>
    <label for="sendKind">Pay to</label>
    <select id="sendKind">
      <option value="lightning">Lightning invoice</option>
      <option value="ark">Arkade address</option>
      <option value="nuri">Nuri username</option>
    </select>
    <label for="sendTarget" id="sendTargetLabel">Invoice (lnbc…)</label>
    <input id="sendTarget" spellcheck="false" autocomplete="off">
    <div id="sendAmountBox">
      <label for="sendAmount">Amount in sats</label>
      <input id="sendAmount" inputmode="numeric" placeholder="2500">
    </div>
    <div id="nameOut" class="result"></div>
    <div id="sendOut" class="result"></div>
    <button id="sendGo" class="primary">Review and pay</button>
  </section>

  <div class="controls">
    <button id="refresh">Refresh</button>
    <button id="disconnect">Disconnect all sites</button>
  </div>
  <script src="lib/bitcoin.js"></script>
  <script src="popup.js"></script>
</body>
</html>
