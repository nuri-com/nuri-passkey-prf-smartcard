name: Card vault
on:
  push:
    branches: [launch/w19-vault-on-card]
  pull_request:
    paths:
      - 'card/vault/**'
      - 'test/vault/**'
      - 'test/test_card_secrets*.py'
      - 'test/test_vault*.py'
      - 'scripts/*vault*'
      - 'scripts/card-secrets.py'
      - '.github/workflows/vault.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8.0.452+9'
      - run: printf 'JAVA8_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install --yes ant
      # Only the vault's already-pinned dependency; no PC/SC package or reader needed.
      - run: python3 -m pip install cryptography==48.0.1
      - name: Simulator and broker checks (three independent passes)
        run: |
          for pass in 1 2 3; do
            bash scripts/test-vault-sim.sh
            python3 -m unittest discover -s test -p 'test_card_secrets*.py' -v
            python3 -m unittest discover -s test -p 'test_vault*.py' -v
          done
      - name: Reproducible CAP (two builds)
        run: |
          VAULT_BUILD_OUT="$PWD/.build/vault-artifacts" bash scripts/build-vault-cap.sh
          VAULT_BUILD_OUT="$PWD/.build/vault-artifacts-2" bash scripts/build-vault-cap.sh
          cmp .build/vault-artifacts/nuri-vault.cap .build/vault-artifacts-2/nuri-vault.cap
          if test -f dist/nuri-vault.cap; then
            cmp dist/nuri-vault.cap .build/vault-artifacts/nuri-vault.cap
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi
      - name: Negative controls must fail closed
        run: python3 test/vault/negative_controls.py
      - uses: actions/upload-artifact@v4
        with:
          name: nuri-vault-cap
          path: |
            .build/vault-artifacts/nuri-vault.cap
            .build/vault-artifacts/SHA256SUMS
          if-no-files-found: error
