name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live read-only proof, no card or signing credentials
        run: node scripts/send/e2e-proof.mjs --dry-run
      - run: for run in 1 2 3; do npm test; done
      - name: Validate README and proof diagrams with negative control
        run: |
          npm install --prefix "$RUNNER_TEMP/mermaid" --no-audit --no-fund mermaid@11.12.0 jsdom@26.1.0
          node scripts/validate-proof-mermaid.mjs "$RUNNER_TEMP/mermaid" "$RUNNER_TEMP/mermaid-proof.json"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes libpcsclite-dev swig
      - run: python -m pip install -r scripts/send/requirements.txt
      - run: python -m unittest discover -s test -p test_arkade_card_bridge.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-e2e-dry-proof
          path: |
            docs/e2e-proof.md
            docs/proofs/e2e-proof.json

  chrome-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright ecdsa pycryptodome
      - run: python -m playwright install --with-deps chromium
      - run: node --test extension/test
      - name: Package and reject accidental overwrite
        run: |
          python scripts/package-chrome.py "$RUNNER_TEMP/Nuri Card"
          if python scripts/package-chrome.py "$RUNNER_TEMP/Nuri Card"; then
            echo "ERROR: overwrote an existing installation"
            exit 1
          fi
      - name: Real Chromium UI and Python native messaging, explicit simulator
        run: |
          for run in 1 2 3; do
            python extension/test/browser_e2e.py "$RUNNER_TEMP/Nuri Card" "$RUNNER_TEMP/evidence-$run"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuri-card-chrome-prototype
          path: |
            ${{ runner.temp }}/Nuri Card.zip
            ${{ runner.temp }}/evidence-*

  card-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8.0.452+9'
      - run: echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes ant rsync
      - run: npm ci
      - run: npm run card:release:verify
      # Preserve the pinned cloud build even when tracked CAPs are stale. The
      # verifier still fails; maintainers must review/import artifacts and rerun.
      - name: Preserve rebuilt release CAPs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuri-card-release-${{ github.sha }}
          path: |
            .build/card-v1/artifacts/*.cap
            .build/card-v1/artifacts/SHA256SUMS
            .build/card-v1/artifacts/BUILD-PROVENANCE.txt
          if-no-files-found: error
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m unittest discover -s test -p test_nuri_pcsc.py -v

  virtual-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes libpcsclite-dev rsync swig
      - run: npm ci
      - run: npm run source:audit
      - run: npm run test:virtual
